<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Reaction</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec, #f3e5f5, #e8eaf6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    gap: 24px;
  }
  h1 {
    font-size: 1.5rem;
    color: #c06080;
    letter-spacing: 2px;
    font-weight: 600;
  }
  #image-box {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #fce4ec;
    border: 4px solid #f8bbd0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    box-shadow: 0 4px 24px #f8bbd055;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    overflow: hidden;
  }
  #image-box.triggered {
    transform: scale(1.12);
    box-shadow: 0 8px 40px #f48fb188;
  }
  #img-display {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  #emoji-display {
    font-size: 5rem;
  }
  #status {
    font-size: 1rem;
    color: #ad6f8a;
    letter-spacing: 1px;
    min-height: 1.5em;
    text-align: center;
  }
  #start-btn {
    padding: 12px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #f48fb1, #ce93d8);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 16px #f48fb155;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #start-btn:active { transform: scale(0.96); }
  #start-btn:disabled {
    background: #e0c8d8;
    cursor: not-allowed;
    box-shadow: none;
  }
  #meter-bar {
    width: 220px;
    height: 8px;
    background: #f8bbd0;
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  #meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f48fb1, #ce93d8);
    border-radius: 8px;
    transition: width 0.08s;
  }
  .info {
    font-size: 0.78rem;
    color: #b08898;
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<h1>✨ Anime Reactor ✨</h1>

<div id="image-box">
  <img id="img-display" src="" alt="reaction">
  <span id="emoji-display">🌸</span>
</div>

<div id="status">Press Start to begin~</div>
<div id="meter-bar"><div id="meter-fill"></div></div>

<button id="start-btn">Start</button>
<div class="info" id="info-text">Desktop: make a sound 🎤 · Mobile: shake your phone 📱</div>

const IDLE_EMOJI = "🌸";
const REACT_EMOJI = "✨";

const idleImg = null;
const reactImg = null;

let lastAudioIdx = -1;
let cooldown = false;
let listening = false;
let audioCtx, analyser, dataArray, source;
let animFrame;

const imgBox = document.getElementById('image-box');
const imgDisplay = document.getElementById('img-display');
const emojiDisplay = document.getElementById('emoji-display');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const meterBar = document.getElementById('meter-bar');
const meterFill = document.getElementById('meter-fill');

function showIdle() {
  if (idleImg) {
    imgDisplay.src = idleImg;
    imgDisplay.style.display = 'block';
    emojiDisplay.style.display = 'none';
  } else {
    emojiDisplay.textContent = IDLE_EMOJI;
    emojiDisplay.style.display = 'block';
    imgDisplay.style.display = 'none';
  }
  imgBox.classList.remove('triggered');
}

function showReact() {
  if (reactImg) {
    imgDisplay.src = reactImg;
    imgDisplay.style.display = 'block';
    emojiDisplay.style.display = 'none';
  } else {
    emojiDisplay.textContent = REACT_EMOJI;
    emojiDisplay.style.display = 'block';
    imgDisplay.style.display = 'none';
  }
  imgBox.classList.add('triggered');
}

function playRandom() {
  let idx;
  do { idx = Math.floor(Math.random() * AUDIOS.length); }
  while (AUDIOS.length > 1 && idx === lastAudioIdx);
  lastAudioIdx = idx;
  console.log('[AnimeReactor] trigger | audio index:', idx);
  const audio = new Audio(AUDIOS[idx]);
  audio.play().catch(e => console.warn('Audio play failed:', e));
}

function trigger(source) {
  if (cooldown) return;
  cooldown = true;
  console.log('[AnimeReactor] triggered by:', source);
  playRandom();
  showReact();
  statusEl.textContent = '💫 Triggered!';
  setTimeout(() => {
    showIdle();
    statusEl.textContent = '👂 Listening~';
    setTimeout(() => { cooldown = false; }, 200);
  }, 800);
  setTimeout(() => { cooldown = false; }, 1500);
}

// ── Desktop: Mic RMS spike detection ──────────────────────────────────
let rmsHistory = [];
const RMS_HISTORY_LEN = 20;       // longer history = smoother baseline
const SPIKE_MULTIPLIER = 3.5;     // must be 3.5x louder than ambient average
const MIN_RMS = 0.10;             // hard floor — ignores anything below ~"loud clap" level
const MIN_SPIKE_DELTA = 0.08;     // absolute jump must also be large, not just relative

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    meterBar.style.display = 'block';
    statusEl.textContent = '👂 Listening~';
    loopMic();
  } catch(e) {
    statusEl.textContent = '⚠️ Mic access denied';
    console.warn('Mic error:', e);
  }
}

function loopMic() {
  animFrame = requestAnimationFrame(loopMic);
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  meterFill.style.width = Math.min(100, rms * 400) + '%';

  if (rmsHistory.length >= RMS_HISTORY_LEN) rmsHistory.shift();
  rmsHistory.push(rms);

  const avg = rmsHistory.reduce((a, b) => a + b, 0) / rmsHistory.length;
  if (rms > MIN_RMS && rms > avg * SPIKE_MULTIPLIER && rms > avg + MIN_SPIKE_DELTA) {
    trigger('mic');
  }
}

// ── Mobile: Shake detection ────────────────────────────────────────────
const SHAKE_THRESHOLD = 18;
let lastShakeCheck = 0;

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const now = Date.now();
  if (now - lastShakeCheck < 100) return;
  lastShakeCheck = now;
  const mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
  if (mag > SHAKE_THRESHOLD) trigger('motion');
}

// ── Start ──────────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  if (listening) return;
  listening = true;
  startBtn.disabled = true;
  startBtn.textContent = 'Listening...';
  showIdle();

  // Always request mic first — must happen synchronously within the click handler
  // so the browser treats it as a user-gesture-initiated permission request.
  await startMic();

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  if (isMobile) {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+ requires explicit permission for DeviceMotion
      try {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
          statusEl.textContent = '📱 Shake or clap~';
        } else {
          statusEl.textContent = '🎤 Clap to trigger~';
        }
      } catch(e) {
        statusEl.textContent = '🎤 Clap to trigger~';
      }
    } else {
      // Android / other — no permission prompt needed
      window.addEventListener('devicemotion', handleMotion);
      statusEl.textContent = '📱 Shake or clap~';
    }
  }
});

showIdle();
</script>
</body>
</html>
