<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anime Reactor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-100: #fff0f5;
    --pink-200: #ffd6e7;
    --pink-300: #ffadd2;
    --pink-400: #ff85c1;
    --pink-500: #eb2f96;
    --peach:    #ffb39a;
    --lavender: #d9b8ff;
    --white:    #ffffff;
    --text-dark:#3d2040;
    --text-mid: #8c5a7a;
    --text-soft:#c49ab8;
    --shadow-soft: 0 8px 32px rgba(200,80,140,0.13);
    --shadow-card: 0 20px 60px rgba(180,60,120,0.18);
    --radius-card: 28px;
    --radius-btn:  50px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(145deg, #ffe0f0 0%, #f5e6ff 40%, #ffe8f0 70%, #ffd6e7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* Floating background orbs */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
    animation: orb-drift 8s ease-in-out infinite alternate;
  }
  .bg-orb-1 { width: 380px; height: 380px; background: #ffb3d9; top: -80px; left: -80px; animation-delay: 0s; }
  .bg-orb-2 { width: 320px; height: 320px; background: #d9b8ff; bottom: -60px; right: -60px; animation-delay: 2s; }
  .bg-orb-3 { width: 200px; height: 200px; background: #ffcba4; top: 50%; left: 60%; animation-delay: 4s; }
  @keyframes orb-drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(20px, -20px) scale(1.07); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    width: 360px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: var(--radius-card);
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: var(--shadow-card),
                inset 0 1px 0 rgba(255,255,255,0.9);
    padding: 36px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* Header */
  .header { text-align: center; }
  .header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: 0.04em;
  }
  .header p {
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-soft);
    margin-top: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Image frame */
  .img-frame {
    position: relative;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd6e7, #e8c8f8);
    padding: 4px;
    box-shadow: 0 0 0 6px rgba(255,180,210,0.25),
                0 12px 40px rgba(200,80,150,0.2);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }
  .img-frame.triggered {
    box-shadow: 0 0 0 8px rgba(255,130,190,0.45),
                0 16px 56px rgba(200,60,140,0.35);
    transform: scale(1.04);
  }
  .img-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #fce4ec;
    position: relative;
  }
  .img-slot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  .img-slot.hidden {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }
  .img-slot.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* Ripple ring on trigger */
  .ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,100,180,0.6);
    opacity: 0;
    transform: scale(1);
    pointer-events: none;
  }
  .ring.pulse {
    animation: ring-pulse 0.7s ease-out forwards;
  }
  @keyframes ring-pulse {
    0%   { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0;   transform: scale(1.22); }
  }

  /* Volume meter */
  .meter-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .meter-track {
    width: 100%;
    height: 6px;
    background: rgba(200,150,180,0.18);
    border-radius: 99px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffb3d9, #d980c8);
    transition: width 0.06s linear;
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 16px;
    border-radius: 99px;
    background: rgba(255,210,230,0.45);
    border: 1px solid rgba(255,170,210,0.35);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-mid);
    letter-spacing: 0.04em;
    transition: background 0.3s, color 0.3s;
  }
  .status-pill.triggered-state {
    background: rgba(255,130,190,0.22);
    color: #c0306a;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--pink-300);
    transition: background 0.3s;
  }
  .status-dot.active {
    background: #ff5aaa;
    box-shadow: 0 0 0 3px rgba(255,90,170,0.3);
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  .status-dot.triggered-dot {
    background: #e0206a;
    box-shadow: 0 0 0 4px rgba(224,32,106,0.25);
    animation: none;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* Start button */
  .btn-start {
    width: 100%;
    padding: 15px 0;
    border: none;
    border-radius: var(--radius-btn);
    background: linear-gradient(135deg, #ff85c1 0%, #c472ed 100%);
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(200,80,180,0.35),
                inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-start:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(200,80,180,0.45),
                inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-start:active:not(:disabled) { transform: scale(0.97); }
  .btn-start:disabled {
    background: linear-gradient(135deg, #e8c8da 0%, #d5b8e8 100%);
    box-shadow: none;
    cursor: default;
    opacity: 0.7;
  }

  /* Footer note */
  .note {
    font-size: 0.66rem;
    color: var(--text-soft);
    text-align: center;
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  @media (max-width: 400px) {
    .card { width: 92vw; padding: 28px 20px 24px; }
    .img-frame { width: 190px; height: 190px; }
  }
</style>
</head>

const imgIdle   = document.getElementById('imgIdle');
const imgReact1 = document.getElementById('imgReact1');
const imgReact2 = document.getElementById('imgReact2');
const REACT_IMGS = [imgReact1, imgReact2];

// ── State ────────────────────────────────────────────────────────────────
let lastAudioIdx  = -1;
let lastReactIdx  = -1;
let cooldown      = false;
let listening     = false;
let animFrame;

// ── DOM refs ─────────────────────────────────────────────────────────────
const startBtn   = document.getElementById('startBtn');
const statusPill = document.getElementById('statusPill');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const meterWrap  = document.getElementById('meterWrap');
const meterFill  = document.getElementById('meterFill');
const meterVal   = document.getElementById('meterVal');
const imgFrame   = document.getElementById('imgFrame');
const ring       = document.getElementById('ring');

// ── Image helpers ────────────────────────────────────────────────────────
function showSlot(slotEl) {
  [imgIdle, imgReact1, imgReact2].forEach(el => {
    if (el === slotEl) {
      el.classList.remove('hidden');
      el.classList.add('visible');
    } else {
      el.classList.remove('visible');
      el.classList.add('hidden');
    }
  });
}

function goIdle() {
  showSlot(imgIdle);
  imgFrame.classList.remove('triggered');
  statusPill.classList.remove('triggered-state');
  statusDot.classList.remove('triggered-dot');
  statusDot.classList.add('active');
  statusText.textContent = 'Listening…';
}

function goReact() {
  let idx;
  do { idx = Math.floor(Math.random() * REACT_IMGS.length); }
  while (REACT_IMGS.length > 1 && idx === lastReactIdx);
  lastReactIdx = idx;
  showSlot(REACT_IMGS[idx]);
  imgFrame.classList.add('triggered');
  statusPill.classList.add('triggered-state');
  statusDot.classList.remove('active');
  statusDot.classList.add('triggered-dot');
  statusText.textContent = '✦ Triggered!';
  // Ring pulse
  ring.classList.remove('pulse');
  void ring.offsetWidth; // reflow
  ring.classList.add('pulse');
}

// ── Audio ────────────────────────────────────────────────────────────────
function playRandom() {
  let idx;
  do { idx = Math.floor(Math.random() * AUDIO_SRCS.length); }
  while (AUDIO_SRCS.length > 1 && idx === lastAudioIdx);
  lastAudioIdx = idx;
  console.log('[Reactor] selected audio index:', idx);
  const a = new Audio(AUDIO_SRCS[idx]);
  a.volume = 1;
  a.play().catch(e => console.warn('[Reactor] audio play error:', e));
}

// ── Trigger ───────────────────────────────────────────────────────────────
function trigger() {
  if (cooldown) return;
  cooldown = true;
  console.log('[Reactor] Triggered');
  playRandom();
  goReact();
  setTimeout(() => {
    goIdle();
    setTimeout(() => { cooldown = false; }, 300);
  }, 800);
  setTimeout(() => { cooldown = false; }, 1500);
}

// ── Mic Detection ─────────────────────────────────────────────────────────
// Dynamic spike: we track a rolling average (ambient baseline)
// and only fire when RMS is BOTH above the hard floor AND a large
// multiple above the recent baseline. This ignores constant noise.

const HARD_FLOOR     = 0.045;  // lowered — phone taps produce a mid-level thud
const SPIKE_RATIO    = 2.4;    // lowered — tap spike needs to be 2.4× ambient
const SPIKE_DELTA    = 0.038;  // lowered — smaller absolute jump still counts
const HISTORY_LEN    = 25;     // frames to average for baseline (~400ms at 60fps)

let rmsHistory = [];

function getRMS(data) {
  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / data.length);
}

function loopMic(analyser, dataArray) {
  animFrame = requestAnimationFrame(() => loopMic(analyser, dataArray));
  analyser.getByteTimeDomainData(dataArray);

  const rms = getRMS(dataArray);

  // Update meter
  const pct = Math.min(100, rms * 380);
  meterFill.style.width = pct + '%';
  meterVal.textContent  = rms.toFixed(3);
  console.log('[Reactor] volume:', rms.toFixed(4));

  // Rolling baseline
  if (rmsHistory.length >= HISTORY_LEN) rmsHistory.shift();
  rmsHistory.push(rms);
  const avg = rmsHistory.reduce((a, b) => a + b, 0) / rmsHistory.length;

  // Fire only on genuine sharp spike
  if (!cooldown &&
      rms > HARD_FLOOR &&
      rms > avg * SPIKE_RATIO &&
      rms > avg + SPIKE_DELTA) {
    trigger();
  }
}

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    console.log('[Reactor] Mic started');

    const ctx      = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume(); // needed on mobile after user gesture
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    const source    = ctx.createMediaStreamSource(stream);
    source.connect(analyser);

    meterWrap.style.display = 'flex';
    goIdle();
    loopMic(analyser, dataArray);
    return true;
  } catch (err) {
    console.error('[Reactor] Mic error:', err);
    statusText.textContent = '⚠ Mic denied — check browser permissions';
    statusDot.classList.remove('active');
    return false;
  }
}

// ── Motion (optional mobile backup) ──────────────────────────────────────
const SHAKE_THRESHOLD = 22;
let lastMotionTime = 0;

function handleMotion(e) {
  if (cooldown) return;
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const now = Date.now();
  if (now - lastMotionTime < 200) return;
  lastMotionTime = now;
  const mag = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
  if (mag > SHAKE_THRESHOLD) {
    console.log('[Reactor] Motion trigger, mag:', mag.toFixed(2));
    trigger();
  }
}

async function tryMotion() {
  if (typeof DeviceMotionEvent === 'undefined') return;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
    } catch(e) {}
  } else {
    window.addEventListener('devicemotion', handleMotion);
  }
}

// ── Start button ──────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  if (listening) return;
  listening = true;
  startBtn.disabled  = true;
  startBtn.textContent = 'Starting…';
  statusText.textContent = 'Requesting mic…';
  statusDot.classList.add('active');

  const ok = await startMic(); // Mic FIRST — inside user gesture
  if (ok) {
    startBtn.textContent = '🎤 Listening';
    await tryMotion(); // optional shake fallback
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Retry';
    listening = false;
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
showSlot(imgIdle);
</script>
